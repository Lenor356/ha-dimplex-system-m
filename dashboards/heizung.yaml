###############################################################################
# DASHBOARD "HEIZUNG" - Dimplex System M
#
# Einbau: Einstellungen -> Dashboards -> Dashboard hinzufügen (leer anlegen),
# dann im Dashboard: Stift -> drei Punkte -> "Raw-Konfigurationseditor" und
# den gesamten Inhalt dieser Datei einfügen.
#
# Sechs Ansichten: Übersicht, Kältekreis, Warmwasser, Heizkreis, Energie,
# Wartung. Ausgelegt für ein 12-Zoll-Tablet im Querformat.
#
# BENÖTIGT (über HACS):
#   - plotly-graph-card       (Heizkurven-Diagramm)
#   - apexcharts-card         (Verläufe und Monatswerte)
#   - lovelace-heat-pump-card (Anlagenbild in der Übersicht)
#   - card-mod                (Hintergrund des Heizkurven-Diagramms)
#   - Theme "ios-dark-mode-blue-red". Ohne dieses Theme die Zeilen "theme:"
#     löschen oder ein eigenes eintragen.
#
# ANPASSEN:
#   - sensor.shellyem3_xxxxxxxxxxxx_channel_*_power (Ansicht "Energie"):
#     eigene Leistungssensoren je Phase, oder den Abschnitt löschen.
###############################################################################
title: Heizung
views:
  - badges:
      - entity: sensor.dimplex_wp_temperatur_aussentemperatur
        icon: mdi:thermometer
        name: Außen
        show_name: true
        type: entity
      - color: orange
        entity: sensor.dimplex_wp_temperatur_warmwasser
        icon: mdi:water-boiler
        name: Warmwasser
        show_name: true
        type: entity
      - entity: sensor.dimplex_wp_heizwasser_anlagendruck
        icon: mdi:gauge
        name: Anlagendruck
        show_name: true
        type: entity
      - color: green
        entity: sensor.dimplex_wp_cop_monat
        icon: mdi:leaf
        name: COP Monat
        show_name: true
        type: entity
      - color: red
        entity: binary_sensor.dimplex_wp_stoerung
        icon: mdi:alert-circle
        name: Störung
        show_name: true
        type: entity
        visibility:
          - condition: state
            entity: binary_sensor.dimplex_wp_stoerung
            state: 'on'
    dense_section_placement: true
    header:
      badges_position: bottom
      card:
        content: |-
          # Wärmepumpe
          {{ states('sensor.dimplex_wp_status') }} · {{ states('sensor.dimplex_wp_statusmeldung') }} · Modus {{ states('sensor.dimplex_wp_betriebsmodus') }}
        text_only: true
        type: markdown
      layout: responsive
    icon: mdi:heat-pump-outline
    max_columns: 4
    path: status
    sections:
      - cards:
          - heading: Anlage
            heading_style: title
            icon: mdi:heat-pump
            type: heading
          - additionalHeating: binary_sensor.dimplex_wp_waermeerzeuger_2_e10
            additionalLabel000: Status
            additionalLabel001: Modus
            additionalLabel002: Wärmeleistung
            additionalLabel003: Volumenstrom
            additionalLabel004: Hochdruck
            additionalLabel005: Niederdruck
            additionalLabel006: Frequenz
            additionalLabel007: COP Monat
            additionalValue000: sensor.dimplex_wp_statusmeldung
            additionalValue001: sensor.dimplex_wp_betriebsmodus
            additionalValue002: sensor.dimplex_wp_leistung_thermisch_w
            additionalValue003: sensor.dimplex_wp_volumenstrom
            additionalValue004: sensor.dimplex_wp_hochdruck
            additionalValue005: sensor.dimplex_wp_niederdruck
            additionalValue006: sensor.dimplex_wp_inverterfrequenz
            additionalValue007: sensor.dimplex_wp_cop_monat
            compressorRunning: binary_sensor.dimplex_wp_verdichter_1
            compressorValue: sensor.dimplex_wp_leistung_elektrisch_w
            error: binary_sensor.dimplex_wp_stoerung
            grid_options:
              columns: full
              rows: auto
            heaterRodWW: binary_sensor.dimplex_wp_heizstab_ausgang
            heatingCircuitPumpRunning: binary_sensor.dimplex_wp_heizungspumpe_m13
            heatingCircuitType1: underfloor
            heatingCircuitType2: 'off'
            heatingCircuitType3: 'off'
            heatingPumpHeatingMode: binary_sensor.dimplex_wp_heizungspumpe_m13
            heatingPumpHotWaterMode: binary_sensor.dimplex_wp_warmwasserpumpe_m18
            heatingPumpStatusOnOff: binary_sensor.dimplex_wp_laeuft
            heatingPumpType: A2W
            hpRunning: binary_sensor.dimplex_wp_primaerpumpe_m11_ventilator_m2
            outdoorTemperature: sensor.dimplex_wp_temperatur_aussentemperatur
            refluxTemperatureHeating: sensor.dimplex_wp_temperatur_ruecklauf_waermepumpe
            storageChargingPumpRunning: binary_sensor.dimplex_wp_zusatzumwaelzpumpe
            supplyTemperature: sensor.dimplex_wp_temperatur_vorlauf
            supplyTemperatureHeating: sensor.dimplex_wp_temperatur_vorlauf
            tankHP: false
            tankTempWWUp: sensor.dimplex_wp_temperatur_warmwasser
            tankWW: true
            title: Dimplex System M
            type: custom:heat-pump-card
            warning: binary_sensor.dimplex_wp_evu_sperre
            wwHeatingValve: binary_sensor.dimplex_wp_warmwasserpumpe_m18
            tankWWSource: heatPump
        column_span: 2
        type: grid
      - cards:
          - heading: Betrieb
            heading_style: title
            icon: mdi:play-circle-outline
            type: heading
          - color: green
            entity: sensor.dimplex_wp_status
            grid_options:
              columns: 12
            icon: mdi:heat-pump
            name: Wärmepumpe
            state_content:
              - state
              - last_changed
            type: tile
          - color: deep-orange
            entity: binary_sensor.dimplex_wp_anforderung_heizen
            grid_options:
              columns: 6
            icon: mdi:radiator
            name: Anforderung Heizen
            type: tile
          - color: orange
            entity: binary_sensor.dimplex_wp_anforderung_warmwasser
            grid_options:
              columns: 6
            icon: mdi:water-boiler
            name: Anforderung Warmwasser
            type: tile
          - color: deep-orange
            entity: sensor.dimplex_wp_leistung_thermisch
            grid_options:
              columns: 6
            icon: mdi:fire
            name: Wärmeleistung
            type: tile
          - color: amber
            entity: sensor.dimplex_wp_leistung_elektrisch
            grid_options:
              columns: 6
            icon: mdi:lightning-bolt
            name: Stromaufnahme
            type: tile
          - color: blue
            entity: sensor.dimplex_wp_volumenstrom
            grid_options:
              columns: 6
            icon: mdi:waves-arrow-right
            name: Volumenstrom
            type: tile
          - color: purple
            entity: sensor.dimplex_wp_inverterfrequenz
            grid_options:
              columns: 6
            icon: mdi:sine-wave
            name: Verdichterfrequenz
            type: tile
          - entity: input_select.dimplex_betriebsmodus_steuerung
            features:
              - type: select-options
            grid_options:
              columns: 12
            icon: mdi:cog-outline
            name: Betriebsmodus
            type: tile
        type: grid
      - cards:
          - heading: Temperaturen
            heading_style: title
            icon: mdi:thermometer
            type: heading
          - color: blue-grey
            entity: sensor.dimplex_wp_temperatur_aussentemperatur
            features:
              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:thermometer
            name: Außen
            type: tile
          - color: orange
            entity: sensor.dimplex_wp_temperatur_warmwasser
            features:
              - hours_to_show: 24
