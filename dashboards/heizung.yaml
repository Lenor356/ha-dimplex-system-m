              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:target
            name: Heizkreis Soll
            type: tile
        type: grid
      - cards:
          - heading: Effizienz
            heading_style: title
            icon: mdi:leaf
            type: heading
          - color: green
            entity: sensor.dimplex_wp_cop
            grid_options:
              columns: 6
            icon: mdi:gauge
            name: COP aktuell
            type: tile
            visibility:
              - condition: state
                entity: sensor.dimplex_wp_cop
                state_not: unavailable
              - condition: state
                entity: sensor.dimplex_wp_cop
                state_not: unknown
          - color: green
            entity: sensor.dimplex_wp_cop_gemessen
            grid_options:
              columns: 6
            icon: mdi:gauge-low
            name: COP gegen Shelly
            type: tile
            visibility:
              - condition: state
                entity: sensor.dimplex_wp_cop
                state_not: unavailable
              - condition: state
                entity: sensor.dimplex_wp_cop
                state_not: unknown
          - color: green
            entity: sensor.dimplex_wp_cop_monat
            grid_options:
              columns: 6
            icon: mdi:calendar-month
            name: COP Monat
            type: tile
          - color: green
            entity: sensor.dimplex_wp_cop_vormonat
            grid_options:
              columns: 6
            icon: mdi:calendar-arrow-left
            name: COP Vormonat
            type: tile
          - color: green
            entity: sensor.dimplex_wp_cop_jahr
            grid_options:
              columns: 6
            icon: mdi:calendar-star
            name: COP Jahr
            type: tile
          - color: green
            entity: sensor.wp_cop
            grid_options:
              columns: 6
            icon: mdi:calendar-week
            name: COP 7 Tage
            type: tile
          - color: cyan
            entity: sensor.dimplex_wp_spreizung_heizkreis
            grid_options:
              columns: 6
            icon: mdi:arrow-expand-vertical
            name: Spreizung
            type: tile
          - color: light-green
            entity: sensor.dimplex_wp_leistung_umwelt
            grid_options:
              columns: 6
            icon: mdi:pine-tree
            name: Umweltleistung
            type: tile
        type: grid
      - cards:
          - heading: Komponenten
            heading_style: title
            icon: mdi:cogs
            type: heading
          - color: green
            entity: binary_sensor.dimplex_wp_verdichter_1
            grid_options:
              columns: 6
            icon: mdi:engine
            name: Verdichter
            type: tile
          - color: green
            entity: binary_sensor.dimplex_wp_primaerpumpe_m11_ventilator_m2
            grid_options:
              columns: 6
            icon: mdi:fan
            name: Ventilator
            type: tile
          - color: blue
            entity: binary_sensor.dimplex_wp_zusatzumwaelzpumpe
            grid_options:
              columns: 6
            icon: mdi:pump
            name: Erzeugerkreispumpe M16
            type: tile
          - color: deep-orange
            entity: binary_sensor.dimplex_wp_heizungspumpe_m13
            grid_options:
              columns: 6
            icon: mdi:pump
            name: Heizkreispumpe M13
            type: tile
          - color: orange
            entity: binary_sensor.dimplex_wp_warmwasserpumpe_m18
            grid_options:
              columns: 6
            icon: mdi:water-pump
            name: Warmwasserpumpe M18
            type: tile
          - color: cyan
            entity: binary_sensor.dimplex_wp_abtauung
            grid_options:
              columns: 6
            icon: mdi:snowflake-melt
