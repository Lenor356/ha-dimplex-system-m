            type: tile
          - color: red
            entity: binary_sensor.dimplex_wp_heizstab_ausgang
            grid_options:
              columns: 6
            icon: mdi:heating-coil
            name: Flanschheizung E9
            type: tile
          - color: red
            entity: binary_sensor.dimplex_wp_evu_sperre
            grid_options:
              columns: 6
            icon: mdi:transmission-tower-off
            name: EVU-Sperre
            type: tile
          - color: red
            entity: binary_sensor.dimplex_wp_stoerung
            grid_options:
              columns: 6
            icon: mdi:alert-circle-outline
            name: Störung
            type: tile
        type: grid
    theme: ios-dark-mode-blue-red
    title: Übersicht
    type: sections
  - dense_section_placement: true
    icon: mdi:snowflake-thermometer
    max_columns: 3
    path: kaeltekreis
    sections:
      - cards:
          - heading: Kältemitteldruck
            heading_style: title
            icon: mdi:gauge
            type: heading
          - entity: sensor.dimplex_wp_hochdruck
            grid_options:
              columns: 6
            max: 45
            min: 0
            name: Hochdruck
            needle: true
            type: gauge
          - entity: sensor.dimplex_wp_niederdruck
            grid_options:
              columns: 6
            max: 20
            min: 0
            name: Niederdruck
            needle: true
            type: gauge
          - color: purple
            entity: sensor.dimplex_wp_inverterfrequenz
            features:
              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:sine-wave
            name: Verdichterfrequenz
            type: tile
          - color: amber
            entity: sensor.dimplex_wp_ueberhitzung
            features:
              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:thermometer-plus
            name: Überhitzung
            type: tile
          - color: green
            entity: binary_sensor.dimplex_wp_verdichter_1
            grid_options:
              columns: 6
            icon: mdi:engine
            name: Verdichter
            type: tile
          - color: green
            entity: binary_sensor.dimplex_wp_primaerpumpe_m11_ventilator_m2
            grid_options:
              columns: 6
            icon: mdi:fan
            name: Ventilator
            type: tile
        type: grid
      - cards:
          - heading: Temperaturen im Kältekreis
            heading_style: title
            icon: mdi:thermometer-lines
            type: heading
          - color: deep-orange
            entity: sensor.dimplex_wp_temperatur_verfluessigung
            features:
              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:thermometer-high
            name: Verflüssigung
            type: tile
          - color: blue
            entity: sensor.dimplex_wp_temperatur_verdampfung
            features:
              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:thermometer-low
            name: Verdampfung
            type: tile
          - color: cyan
            entity: sensor.dimplex_wp_temperatur_sauggas
            features:
              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:pipe
            name: Sauggas
            type: tile
          - color: blue-grey
            entity: sensor.dimplex_wp_temperatur_aussentemperatur
            features:
              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:weather-windy
            name: Außenluft
            type: tile
          - color: cyan
            entity: binary_sensor.dimplex_wp_abtauung
            grid_options:
              columns: 6
            icon: mdi:snowflake-melt
            name: Abtauung
            type: tile
          - color: grey
            entity: sensor.dimplex_wp_taktungen_verdichter_gesamt
            grid_options:
              columns: 6
            icon: mdi:counter
            name: Verdichterstarts
            type: tile
        type: grid
      - cards:
          - heading: Hydraulik
            heading_style: title
            icon: mdi:pipe-valve
            type: heading
          - entity: sensor.dimplex_wp_heizwasser_anlagendruck
            grid_options:
              columns: 6
            max: 3
            min: 0
            name: Anlagendruck
            needle: true
            segments:
              - color: '#EF5350'
                from: 0
              - color: '#FFCA28'
                from: 1
              - color: '#66BB6A'
                from: 1.3
              - color: '#EF5350'
                from: 2.5
            type: gauge
          - color: blue
            entity: sensor.dimplex_wp_volumenstrom
            features:
              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:waves-arrow-right
            name: Volumenstrom
            type: tile
          - color: deep-orange
            entity: sensor.dimplex_wp_temperatur_vorlauf
            grid_options:
              columns: 6
            icon: mdi:thermometer-chevron-up
            name: Vorlauf
            type: tile
          - color: blue
            entity: sensor.dimplex_wp_temperatur_ruecklauf_waermepumpe
            grid_options:
              columns: 6
            icon: mdi:thermometer-chevron-down
            name: Rücklauf
            type: tile
          - color: cyan
            entity: sensor.dimplex_wp_spreizung_heizkreis
            grid_options:
              columns: 12
            icon: mdi:arrow-expand-vertical
            name: Spreizung
            type: tile
        type: grid
      - cards:
          - heading: Drücke und Verdichterfrequenz
            heading_style: title
            icon: mdi:chart-line
            type: heading
          - apex_config:
              chart:
                height: 300
              legend:
                show: true
              tooltip:
                shared: true
            graph_span: 24h
            grid_options:
              columns: full
            header:
              colorize_states: true
              show: true
              show_states: true
              title: Letzte 24 Stunden
            series:
              - color: '#FF7043'
                entity: sensor.dimplex_wp_hochdruck
                group_by:
                  duration: 5min
                  fill: last
                  func: avg
                name: Hochdruck
                stroke_width: 2
                yaxis_id: bar
              - color: '#42A5F5'
                entity: sensor.dimplex_wp_niederdruck
                group_by:
                  duration: 5min
                  fill: last
                  func: avg
                name: Niederdruck
                stroke_width: 2
                yaxis_id: bar
              - color: '#B0BEC5'
                entity: sensor.dimplex_wp_inverterfrequenz
                group_by:
                  duration: 5min
                  fill: last
                  func: max
                name: Frequenz
                opacity: 0.2
                stroke_width: 1
                type: area
                yaxis_id: hz
            type: custom:apexcharts-card
            yaxis:
              - apex_config:
                  tickAmount: 5
                  title:
                    text: bar
                decimals: 0
                id: bar
                max: 50
                min: 0
              - apex_config:
                  tickAmount: 5
                  title:
                    text: Hz
                decimals: 0
                id: hz
                max: 100
                min: 0
                opposite: true
        column_span: 3
        type: grid
      - cards:
          - heading: Temperaturen im Kältekreis
            heading_style: title
            icon: mdi:chart-line
            type: heading
          - apex_config:
              chart:
                height: 300
              legend:
                show: true
              tooltip:
                shared: true
            graph_span: 24h
            grid_options:
              columns: full
            header:
              colorize_states: true
              show: true
              show_states: true
              title: Letzte 24 Stunden
            series:
              - color: '#FF7043'
                entity: sensor.dimplex_wp_temperatur_verfluessigung
                group_by:
                  duration: 5min
                  fill: last
                  func: avg
                name: Verflüssigung
                stroke_width: 2
              - color: '#42A5F5'
                entity: sensor.dimplex_wp_temperatur_verdampfung
                group_by:
                  duration: 5min
                  fill: last
                  func: avg
                name: Verdampfung
                stroke_width: 2
              - color: '#66BB6A'
                entity: sensor.dimplex_wp_temperatur_sauggas
                group_by:
                  duration: 5min
                  fill: last
                  func: avg
                name: Sauggas
                stroke_width: 2
              - color: '#90A4AE'
                entity: sensor.dimplex_wp_temperatur_aussentemperatur
                group_by:
                  duration: 5min
                  fill: last
                  func: avg
                name: Außenluft
                stroke_width: 2
            type: custom:apexcharts-card
        column_span: 3
        type: grid
    theme: ios-dark-mode-blue-red
    title: Kältekreis
    type: sections
