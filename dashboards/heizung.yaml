              - hours_to_show: 24
                type: trend-graph
            grid_options:
              columns: 6
            icon: mdi:home-thermometer-outline
            name: Heizkreis Ist
            type: tile
          - color: grey
            entity: sensor.dimplex_wp_temperatur_ruecklauf_soll
